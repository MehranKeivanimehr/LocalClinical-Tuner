[project]
name = "localclinical-tuner"
version = "0.1.0"
description = "Privacy-preserving fine-tuning of open LLMs for clinical documentation (SFT + ORPO with Unsloth QLoRA, GGUF export, local serving)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "LocalClinical-Tuner contributors" }]
keywords = ["llm", "fine-tuning", "qlora", "orpo", "unsloth", "clinical-nlp", "gguf", "ollama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core deps: everything needed for data generation, metrics and the OpenAI-compatible client.
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "openai>=1.40",
    "tqdm>=4.66",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "rouge-score>=0.1.2",
    "anthropic>=1.0",
]

[project.optional-dependencies]
# GPU training stack (Unsloth + TRL). Unsloth pins compatible torch/transformers/trl/peft versions.
train = [
    "unsloth>=2026.10.3",
    "unsloth-zoo>=2026.10.3",
    "trl>=1.0",
    "peft>=0.17",
    "transformers>=4.56",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
]
# Reference-based semantic metric.
eval = ["bert-score>=0.3.13"]
# Local UI.
serve = ["gradio>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_tuner"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["third_party", "outputs", "unsloth_compiled_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905"]  # SIM905: keep readable "a b c".split() word lists

[tool.pytest.ini_options]
testpaths = ["tests"]
